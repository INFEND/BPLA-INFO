name: UAV photographic sources · licensed candidate research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/research_photos.py'
      - '.github/workflows/photo-research.yml'
permissions:
  contents: read
jobs:
  find-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Search Wikimedia Commons for exact model photos
        run: python3 scripts/research_photos.py --output photo_candidates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uav-photo-sources
          path: photo_candidates.json
          if-no-files-found: error
