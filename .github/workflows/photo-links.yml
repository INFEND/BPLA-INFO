name: Photo sources integrity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/photo_sources.json'
      - 'scripts/verify_photo_sources.py'
      - '.github/workflows/photo-links.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_photo_sources.py
