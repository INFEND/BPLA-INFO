name: Photo mask proposals (review only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/propose_unapproved_masks.py'
      - 'scripts/triage_mask_proposals.py'
      - 'scripts/verify_mask_rgb.py'
      - 'tests/test_verify_mask_rgb.py'
      - 'tests/test_triage_mask_proposals.py'
      - 'tests/test_mask_batch_limit.py'
      - 'tests/test_photo_review_priority.py'
      - 'tests/test_photo_proposal_provenance.py'
      - '.github/workflows/photo-mask-proposals.yml'
      - 'research/photos/originals/**'
permissions:
  contents: read
jobs:
  proposals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Create unapproved candidate masks from original pixels
        run: python scripts/propose_unapproved_masks.py --limit 26
      - name: Test conservative proposal triage
        run: python -m unittest discover -s tests -p 'test_triage_mask_proposals.py' -v
      - name: Test source attribution gate
        run: python -m unittest discover -s tests -p 'test_photo_proposal_provenance.py' -v
      - name: Test source review ordering
        run: python -m unittest discover -s tests -p 'test_photo_review_priority.py' -v
      - name: Test batch limit after invalid-source skips
        run: python -m unittest discover -s tests -p 'test_mask_batch_limit.py' -v
      - name: Test original RGB integrity verifier
        run: python -m unittest discover -s tests -p 'test_verify_mask_rgb.py' -v
      - name: Verify every proposed cutout retains original RGB pixels
        run: python scripts/verify_mask_rgb.py
      - name: Reject broken masks and write review-only QA report
        run: python scripts/triage_mask_proposals.py
      - name: Upload review previews, never APK assets
        uses: actions/upload-artifact@v4
        with:
          name: BPLA-unapproved-mask-proposals
          path: staging/mask_candidates/
          retention-days: 7
