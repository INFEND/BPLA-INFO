name: Research · public 2024 UAV classifier
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/import_lostarmour.py'
      - '.github/workflows/uav-import-probe.yml'
permissions:
  contents: read
jobs:
  inspect-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python -m pip install "pymupdf==1.26.5"
      - name: Inspect PDF geometry and text
        run: python scripts/import_lostarmour.py --probe | tee /tmp/probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lostarmour-uav-probe
          path: /tmp/probe.txt
