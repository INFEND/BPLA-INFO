name: Import approved public-domain RQ-20 photos once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-rq20-once.yml'
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check Pillow==11.2.1
      - name: Embed two verified public-domain photographs into APK assets
        run: python3 scripts/import_approved_rq20.py
      - name: Validate manifest and embedded image checksums
        run: python3 -m unittest discover -s tests -p 'test_photo_delivery.py' -v
      - name: Commit real binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "INFEND Asset Import"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/bundled_photos.json app/src/main/assets/photos/
          if ! git diff --cached --quiet; then
            git commit -m "assets: embed two verified public-domain RQ-20 photographs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
