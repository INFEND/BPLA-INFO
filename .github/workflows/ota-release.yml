name: BPLA INFO Android OTA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - 'release_notes/**'
permissions:
  contents: write
concurrency:
  group: bpla-info-release
  cancel-in-progress: false
jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android platforms
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Install independent photo decoder
        run: python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Test manifest logic
        run: python3 -m unittest discover -s tests -v
      - name: Verify measurement display on JVM
        shell: bash
        run: |
          mkdir -p /tmp/bpla-format-check
          javac -encoding UTF-8 -d /tmp/bpla-format-check app/src/main/java/dev/infend/bplainfo/SpecFormatter.java tests/SpecFormatterSmoke.java
          java -cp /tmp/bpla-format-check dev.infend.bplainfo.SpecFormatterSmoke
      - name: Verify landscape and portrait photo dimensions on JVM
        shell: bash
        run: |
          mkdir -p /tmp/bpla-photo-dimensions
          javac -encoding UTF-8 -d /tmp/bpla-photo-dimensions app/src/main/java/dev/infend/bplainfo/PhotoDimensions.java tests/PhotoDimensionsSmoke.java
          java -cp /tmp/bpla-photo-dimensions dev.infend.bplainfo.PhotoDimensionsSmoke
      - name: Compile Android debug and release
        id: compilation
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Audit actual APK photo assets (debug and release)
        run: |
          python3 scripts/audit_apk_photos.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/audit_apk_photos.py app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Audit embedded 2025 bulletin catalog in APKs
        run: |
          python3 scripts/audit_apk_bulletin.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/audit_apk_bulletin.py app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Audit 60-page user PDF catalog embedded in APKs
        run: |
          python3 scripts/audit_apk_vsu_pdf.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/audit_apk_vsu_pdf.py app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload test APK before signing
        if: steps.compilation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BPLA-INFO-debug-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Confirm release signing configuration
        if: github.event_name != 'pull_request'
        env:
          BPLA_INFO_SIGNING_BUNDLE: ${{ secrets.BPLA_INFO_SIGNING_BUNDLE || secrets.INFEND_SIGNING_BUNDLE || secrets.ANDROID_SIGNING_BUNDLE }}
        shell: bash
        run: |
          if [[ -z "$BPLA_INFO_SIGNING_BUNDLE" ]]; then
            echo "::error::No permanent BPLA signing bundle was supplied"
            exit 1
          fi
          echo "Permanent signing bundle is available; its contents are not logged."
      - name: Sign release with permanent key
        id: signing
        if: github.event_name != 'pull_request'
        env:
          BPLA_INFO_SIGNING_BUNDLE: ${{ secrets.BPLA_INFO_SIGNING_BUNDLE || secrets.INFEND_SIGNING_BUNDLE || secrets.ANDROID_SIGNING_BUNDLE }}
        run: python3 scripts/sign_release.py
      - name: Audit signed APK photo bytes
        if: github.event_name != 'pull_request'
        run: python3 scripts/audit_apk_photos.py dist/BPLA-INFO.apk
      - name: Audit embedded 2025 bulletin in signed APK
        if: github.event_name != 'pull_request'
        run: python3 scripts/audit_apk_bulletin.py dist/BPLA-INFO.apk
      - name: Audit user PDF catalog embedded in signed APK
        if: github.event_name != 'pull_request'
        run: python3 scripts/audit_apk_vsu_pdf.py dist/BPLA-INFO.apk
      - name: Generate and verify update.json
        if: github.event_name != 'pull_request'
        id: info
        run: |
          python3 scripts/make_manifest.py --apk dist/BPLA-INFO.apk --aapt "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" --output dist/update.json --github-output "$GITHUB_OUTPUT"
          python3 -m json.tool dist/update.json >/dev/null
      - name: Save signed APK and manifest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: BPLA-INFO-OTA
          path: |
            dist/BPLA-INFO.apk
            dist/update.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        id: publishing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.info.outputs.version }}
          TAG: ${{ steps.info.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Bump app version for a new release."
            exit 0
          fi
          test -s "release_notes/$TAG.txt"
          gh release create "$TAG" dist/BPLA-INFO.apk dist/update.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "БПЛА ИНФО $VERSION" --notes-file "release_notes/$TAG.txt" --latest
          for name in BPLA-INFO.apk update.json; do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"
          done
          {
            echo "### БПЛА ИНФО · опубликован релиз $TAG"
            echo ""
            echo "- [Скачать APK](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BPLA-INFO.apk)"
            echo "- [OTA-манифест](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/update.json)"
          } >> "$GITHUB_STEP_SUMMARY"

